name: Zapret-only smoke tests

on:
  push:
    branches:
      - main
      - feature/no-click-setup-launch-20261010
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify launcher help
        shell: cmd
        run: call launch.cmd --help
      - name: Auto-setup on first double-click (no arguments)
        shell: cmd
        env:
          SUPERSUBOI_CI_SKIP_GUI: "1"
        run: call launch.cmd
      - name: Reuse prepared environment on subsequent double-click
        shell: cmd
        env:
          SUPERSUBOI_CI_SKIP_GUI: "1"
        run: call launch.cmd
      - name: Verify first-run setup artifacts
        shell: pwsh
        run: |
          if (!(Test-Path ".venv/Scripts/python.exe")) { throw "Missing local Python environment" }
          if (!(Test-Path ".venv/.supersuboi-ready")) { throw "Missing successful setup marker" }
      - name: Verify launcher dependencies
        shell: cmd
        run: call launch.cmd --check
      - name: Verify generated first-run configuration
        shell: pwsh
        run: |
          if (!(Test-Path ".env")) { throw "Missing .env" }
          if (!(Test-Path "config.properties")) { throw "Missing config.properties" }
      - name: Check Python syntax
        run: .\.venv\Scripts\python.exe -m compileall -q run.py update-resource.py src tests
      - name: Run Zapret-only regression tests
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile QML resources
        run: .\.venv\Scripts\python.exe update-resource.py
