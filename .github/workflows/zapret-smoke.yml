name: Zapret-only smoke tests

on:
  push:
    branches:
      - main
      - feature/one-click-windows-launcher-20261010
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify launcher help
        shell: cmd
        run: call launch.cmd --help
      - name: Set up virtual environment through launcher
        shell: cmd
        run: call launch.cmd --setup-only
      - name: Verify launcher dependencies
        shell: cmd
        run: call launch.cmd --check
      - name: Verify generated first-run configuration
        shell: pwsh
        run: |
          if (!(Test-Path ".env")) { throw "Missing .env" }
          if (!(Test-Path "config.properties")) { throw "Missing config.properties" }
      - name: Check Python syntax
        run: .\.venv\Scripts\python.exe -m compileall -q run.py update-resource.py src tests
      - name: Run Zapret-only regression tests
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -p "test_*.py" -v
      - name: Compile QML resources
        run: .\.venv\Scripts\python.exe update-resource.py
