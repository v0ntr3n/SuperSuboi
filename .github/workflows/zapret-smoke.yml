name: Zapret-only smoke tests

on:
  push:
    branches:
      - zapret-only-cleanup-20261010
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: python -m compileall -q run.py update-resource.py src tests
      - name: Run Zapret-only regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Install Qt resource compiler
        run: python -m pip install "PySide6>=6.8,<7"
      - name: Compile QML resources
        run: python update-resource.py
